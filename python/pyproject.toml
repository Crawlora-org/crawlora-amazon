[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlora-amazon"
version = "0.1.2"
description = "Crawlora Amazon API client with 5 endpoints for product search, suggestions, product details, and chart/category discovery"
readme = "README.md"
keywords = ["crawlora", "api-client", "sdk", "web-scraping", "scraping-api", "amazon", "amazon-api", "amazon-scraper", "amazon-data", "amazon-product-search", "amazon-suggestions", "amazon-product-details", "amazon-chart-category-discovery"]
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crawlora" }]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Typing :: Typed",
]
dependencies = ["typing-extensions>=4.7; python_version < '3.11'"]

[project.optional-dependencies]
async = ["httpx>=0.27"]
test = ["mypy>=1.11", "pytest>=8"]

[project.urls]
Homepage = "https://crawlora.net/?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=amazon-python-homepage"
Documentation = "https://crawlora.net/docs?utm_source=pypi&utm_medium=referral&utm_campaign=platform-clients&utm_content=amazon-python-api-docs"
Repository = "https://github.com/Crawlora-org/crawlora-amazon"

[tool.setuptools.packages.find]
where = ["."]
include = ["crawlora_amazon"]

[tool.setuptools.package-data]
"crawlora_amazon" = ["py.typed", "*.pyi"]
